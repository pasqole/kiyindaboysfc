<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<title>KBFC011 — KBFC Verify</title>
<link rel="manifest" href="/verify/manifest.json">
<style>
  :root {
    --navy:#1B2A4A; --navydk:#131E35; --red:#CC2229;
    --white:#FFFFFF; --offwhite:#EEF1F7; --silver:#C8D0DF;
    --muted:#7B90B8; --active:#22863A; --activebg:#D4EDDA;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html,body {
    height:100%; background:var(--navy);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--white);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body { min-height:100vh; display:flex; flex-direction:column; }

  header {
    background:var(--navydk); border-bottom:3px solid var(--red);
    padding:16px 20px 14px; display:flex; align-items:center; gap:12px; flex-shrink:0;
  }
  .back {
    color:var(--silver); font-size:14px; text-decoration:none;
    display:flex; align-items:center; gap:6px; padding:4px;
  }
  .back:active { opacity:.7; }
  header h1 { font-size:16px; font-weight:700; }

  .main { flex:1; padding:28px 20px; display:flex; flex-direction:column; gap:20px; }

  /* Status card */
  .status-card {
    border-radius:16px; padding:24px 20px;
    display:flex; align-items:center; gap:16px;
  }
  .status-active  { background:var(--activebg); }
  .status-inactive{ background:#f8d7da; }

  .status-icon {
    font-size:36px; flex-shrink:0; line-height:1;
  }
  .status-text h2 { font-size:22px; font-weight:700; }
  .status-text h2.active   { color:var(--active); }
  .status-text h2.inactive { color:#721c24; }
  .status-text p  { font-size:13px; margin-top:3px; }
  .status-text p.active   { color:#155724; }
  .status-text p.inactive { color:#721c24; }

  /* Member details */
  .detail-card {
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px; overflow:hidden;
  }
  .detail-row {
    display:flex; align-items:flex-start;
    padding:14px 18px; gap:16px;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .detail-row:last-child { border-bottom:none; }
  .detail-label {
    font-size:11px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em;
    width:80px; flex-shrink:0; padding-top:1px;
  }
  .detail-value { font-size:15px; font-weight:600; flex:1; }
  .detail-value.id { font-family:'Courier New',monospace; font-size:16px; letter-spacing:.05em; }

  /* Tier badge */
  .tier-pill {
    display:inline-block; background:var(--red); color:#fff;
    font-size:11px; font-weight:700; letter-spacing:.1em;
    padding:4px 10px; border-radius:20px;
  }

  footer {
    text-align:center; padding:16px 20px;
    font-size:11px; color:var(--muted);
    border-top:1px solid rgba(255,255,255,.06); flex-shrink:0;
  }
</style>
</head>
<body>

<header>
  <a class="back" href="/verify/">← All members</a>
  <h1 style="margin-left:auto;color:var(--muted);font-size:13px;font-weight:500">KBFC011</h1>
</header>

<div class="main">
  <div class="status-card status-active">
    <div class="status-icon">✅</div>
    <div class="status-text">
      <h2 class="active">Valid member</h2>
      <p class="active">Season ticket confirmed — allow entry</p>
    </div>
  </div>

  <div class="detail-card">
    <div class="detail-row">
      <div class="detail-label">Name</div>
      <div class="detail-value">Byron Walugembe</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Member ID</div>
      <div class="detail-value id">KBFC011</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Tier</div>
      <div class="detail-value"><span class="tier-pill">Ultras</span></div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Valid</div>
      <div class="detail-value">Sep 2026 – Jun 2027</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Phone</div>
      <div class="detail-value">0701195350</div>
    </div>
  </div>
</div>

<footer>Kiyinda Boys FC · FUFA Big League · 0774 646 502</footer>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(console.warn);
}
</script>
</body>
</html>
